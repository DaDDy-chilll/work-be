name: Docker Build and Push
on:
  push:
    branches:
      - development
      - staging
      - production
      - devops
    tags:
    - '*'
    
jobs:
  deploy:
    name: Deployment
    runs-on: ubuntu-latest
    environment: dmh_development
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup AWS ECR
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1 #${{secrets.AWS_REGION}}

      - name: Login to Amazon ECR
        id: login-pf-aws-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push the tagged docker image to Amazon ECR
        env:
          ECR: ${{ steps.login-pf-aws-ecr.outputs.registry }}
          REPO: hospitalmyanmar
          BRANCH_NAME: ${{ github.ref_name }} # Branch name
          
        run: |
          IMAGE_TAG="dmh-api-$BRANCH_NAME" 
          docker build -t $ECR/$REPO:$IMAGE_TAG .
          docker push $ECR/$REPO:$IMAGE_TAG

      - name: Deploy to Development
        if:  github.ref == 'refs/heads/development' 
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DMH_EC2_IP }}
          username: ${{ secrets.DMH_EC2_USER }}
          key: ${{ secrets.DMH_SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            cd /home/ubuntu/devops/
            bash dmh-dev-deploy.sh

      - name: Deploy to Production
        if:  github.ref == 'refs/heads/production' 
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DMH_PROD_EC2_IP }}
          username: ${{ secrets.DMH_EC2_USER }}
          key: ${{ secrets.DMH_SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            cd /home/ubuntu/devops/
            bash dmh-production-deploy.sh